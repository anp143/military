<div class="background"></div>
<div class="over"></div>

<div class="purchase-container">
  <h2>Purchase Entry</h2>

  <form [formGroup]="purchaseForm" (ngSubmit)="submitPurchase()">
    <label for="asset">Asset:</label>
    <select id="asset" formControlName="assetId">
      <option value="">-- Select Asset --</option>
      <option *ngFor="let asset of assets" [value]="asset.id">
        {{ asset.name }} ({{ asset.type }})
      </option>
    </select>

    <label for="quantity">Quantity:</label>
    <input type="number" id="quantity" formControlName="quantity" min="1">

    <button type="submit" [disabled]="purchaseForm.invalid">Add Purchase</button>
    <button type="button" class="back-btn" (click)="goback()"> Back</button>
  </form>

 
   <h3>Purchase Transactions</h3>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Asset</th>
        <th>Quantity</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let t of purchaseList">
  <td>{{ t.id }}</td>
  <td>{{ t.asset.name }}</td>
  <td>{{ t.quantity }}</td>
  <td>{{ t.date | date:'shortDate' }}</td>
</tr>

    </tbody>
  </table>
</div>
